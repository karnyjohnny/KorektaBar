name: Release KorektaBar (MSYS2 Win64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Opcjonalna nazwa taga wydania (np. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build KorektaBar.exe (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            make
            zip

      - name: Wygeneruj ikonę KorektaBar.ico
        run: |
          python3 scripts/generate_assets.py

      - name: Kompiluj KorektaBar.exe (statyczna binarka bez zewnętrznych DLL)
        run: |
          make -C native clean
          make -C native -j$(nproc)
          ls -lh native/build/KorektaBar.exe

      - name: Spakuj paczkę wydania (ZIP)
        run: |
          mkdir -p release_pkg
          cp native/build/KorektaBar.exe release_pkg/
          cp README.md release_pkg/
          cp assets/KorektaBar.ico release_pkg/
          cd release_pkg && zip -r ../KorektaBar-win64.zip .

      - name: Wyślij artefakt budowy
        uses: actions/upload-artifact@v4
        with:
          name: KorektaBar-win64
          path: |
            native/build/KorektaBar.exe
            KorektaBar-win64.zip

      - name: Opublikuj w GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KorektaBar-win64.zip
            native/build/KorektaBar.exe
          generate_release_notes: true
